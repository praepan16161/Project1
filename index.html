    <style>
        /* =====================================================
           RESET & BASE STYLES
        ===================================================== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Kanit", sans-serif;
            background: #001a54;
            color: #102a56;
            overflow-x: hidden;
        }

        /* =====================================================
           NAVBAR (RESPONSIVE & CLICKABLE)
        ===================================================== */
        nav {
            height: 85px;
            background: rgba(255, 255, 255, 0.98);
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 40px;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            z-index: 99999; /* ให้ Navbar อยู่ชั้นบนสุดเสมอ */
            box-shadow: 0 4px 20px rgba(0, 43, 127, 0.08);
            backdrop-filter: blur(10px);
        }

        .nav-logo {
            display: flex;
            align-items: center;
            gap: 12px;
            text-decoration: none;
            cursor: pointer;
        }

        .nav-logo-box {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #002b7f, #001a54);
            color: #ffffff;
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 8px;
            box-shadow: 0 3px 10px rgba(0, 43, 127, 0.25);
        }

        .nav-logo-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 800;
            font-size: 18px;
            letter-spacing: 1.5px;
            color: #001a54;
        }

        .nav-links {
            display: flex;
            align-items: center;
            gap: 28px;
            margin-left: auto;
        }

        .nav-links a {
            position: relative;
            color: #0f244a;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 16px;
            font-weight: 700;
            letter-spacing: 1.5px;
            padding: 10px 0;
            text-transform: uppercase;
            transition: all 0.3s ease;
            cursor: pointer;
            z-index: 10;
        }

        .nav-links a::after {
            content: "";
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 0;
            height: 3.5px;
            background: #002b7f;
            border-radius: 2px;
            transition: width 0.3s ease;
        }

        .nav-links a:hover,
        .nav-links a.active {
            color: #002b7f;
        }

        .nav-links a:hover::after,
        .nav-links a.active::after {
            width: 100%;
        }

        .nav-links a.nav-btn-contact {
            background: #002b7f;
            color: #ffffff;
            font-size: 15px;
            padding: 10px 24px;
            border-radius: 8px;
            box-shadow: 0 4px 15px rgba(0, 43, 127, 0.25);
        }

        .nav-links a.nav-btn-contact::after {
            display: none;
        }

        .nav-links a.nav-btn-contact:hover {
            background: #001a54;
            transform: translateY(-2px);
            box-shadow: 0 6px 18px rgba(0, 43, 127, 0.35);
        }

        .mobile-menu-btn {
            display: none;
            background: none;
            border: none;
            font-size: 26px;
            color: #001a54;
            cursor: pointer;
        }

        /* =====================================================
           HERO SECTION
        ===================================================== */
        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
            min-height: 600px;
            overflow: hidden;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 100px 8% 60px;
        }

        /* รูปภาพ Background */
        .hero-bg-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center;
            z-index: 1;
        }

        /* เลเยอร์สีโปร่งแสง (ไม่บล็อกการคลิก) */
        .overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(0, 26, 84, 0.45) 0%, rgba(0, 13, 43, 0.35) 100%);
            z-index: 2;
            pointer-events: none; /* สำคัญ: ทำให้คลิกทะลุเลเยอร์นี้ได้ */
        }

        /* HERO LEFT CONTENT */
        .hero-text {
            position: relative;
            z-index: 10; /* ดันเนื้อหาและปุ่มขึ้นมาอยู่หน้าสุด */
            color: #ffffff;
            max-width: 550px;
            animation: fadeUp 1s ease;
        }

        .hero-text h1 {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
            font-size: clamp(38px, 5vw, 76px);
            letter-spacing: 4px;
            margin-bottom: 12px;
            text-transform: uppercase;
            text-shadow: 0 4px 20px rgba(0, 0, 0, 0.9);
            line-height: 1.1;
        }

        .hero-text p {
            font-family: 'Chakra Petch', sans-serif;
            font-weight: 600;
            font-size: clamp(16px, 2vw, 24px);
            letter-spacing: 2px;
            margin-bottom: 35px;
            color: #ffffff;
            text-shadow: 0 2px 12px rgba(0, 0, 0, 0.9);
        }

        /* GLITCH BUTTON */
        .btn {
            position: relative;
            display: inline-block;
            padding: 14px 38px;
            border: 2px solid #ffffff;
            color: #ffffff;
            text-decoration: none;
            font-family: 'Montserrat', sans-serif;
            font-size: 15px;
            font-weight: 800;
            letter-spacing: 2.5px;
            transition: all 0.3s ease;
            background: rgba(0, 26, 84, 0.7);
            backdrop-filter: blur(6px);
            overflow: hidden;
            border-radius: 6px;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            z-index: 20;
        }

        .btn-glitch {
            position: relative;
            display: inline-block;
            color: #ffffff;
            text-shadow: 
                -1.5px -0.5px 0px rgba(0, 255, 255, 0.8),
                 1.5px  0.5px 0px rgba(255, 0, 80, 0.8);
        }

        .btn:hover {
            background: #ffffff;
            color: #001a54;
            border-color: #ffffff;
            box-shadow: 0 0 25px rgba(255, 255, 255, 0.7);
            transform: translateY(-3px);
        }

        .btn:hover .btn-glitch {
            color: #001a54;
        }

        /* HERO RIGHT SLOGAN TEXT */
        .hero-right-text {
            position: relative;
            z-index: 10;
            max-width: 550px;
            text-align: right;
            color: #ffffff;
            animation: fadeUp 1.2s ease;
            pointer-events: none;
        }

        .hero-slogan-main {
            font-family: 'Kanit', sans-serif;
            font-size: clamp(28px, 3.5vw, 50px);
            font-weight: 800;
            line-height: 1.25;
            margin-bottom: 14px;
            color: #ffffff;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
        }

        .hero-slogan-main span.eng-text {
            font-family: 'Montserrat', sans-serif;
            font-weight: 900;
        }

        .highlight-gold {
            color: #ffb703;
            font-weight: 900;
            display: inline-block;
            text-shadow: 0 4px 18px rgba(0, 0, 0, 0.95);
        }

        .hero-slogan-sub {
            font-family: 'Kanit', sans-serif;
            font-size: clamp(16px, 1.8vw, 24px);
            font-weight: 400;
            color: #ffffff;
            line-height: 1.6;
            text-shadow: 0 3px 14px rgba(0, 0, 0, 0.95);
        }

        .highlight-badge {
            color: #ffffff;
            font-weight: 700;
            border-bottom: 3.5px solid #ffb703;
            padding-bottom: 2px;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(20px); }
            to   { opacity: 1; transform: translateY(0); }
        }

        /* =====================================================
           RESPONSIVE DESIGN (MOBILE & TABLET)
        ===================================================== */
        @media (max-width: 992px) {
            nav {
                padding: 0 25px;
            }

            .mobile-menu-btn {
                display: block;
            }

            .nav-links {
                position: absolute;
                top: 85px;
                left: 0;
                width: 100%;
                background: #ffffff;
                flex-direction: column;
                gap: 0;
                padding: 10px 0;
                box-shadow: 0 10px 20px rgba(0,0,0,0.1);
                display: none;
                z-index: 99999;
            }

            .nav-links.show {
                display: flex;
            }

            .nav-links a {
                width: 100%;
                text-align: center;
                padding: 14px 0;
                border-bottom: 1px solid #edf2f9;
            }

            .nav-links a.nav-btn-contact {
                margin: 15px auto;
                width: 80%;
            }

            .hero {
                flex-direction: column;
                justify-content: center;
                text-align: center;
                padding: 130px 25px 80px;
                gap: 35px;
                height: auto;
                min-height: 100vh;
            }

            .hero-text {
                max-width: 100%;
                text-align: center;
            }

            .hero-right-text {
                max-width: 100%;
                text-align: center;
            }
        }

        /* =====================================================
           FOOTER
        ===================================================== */
        footer {
            background: linear-gradient(135deg, #001a54, #000d2b);
            color: #ffffff;
            padding: 25px 20px;
            text-align: center;
            border-top: 3px solid #002b7f;
            position: relative;
            z-index: 10;
        }

        footer p {
            font-size: 13px;
            color: #a0b4d8;
        }
    </style>
</head>

    </footer>

    <!-- JAVASCRIPT FOR MOBILE MENU -->
    <script>
        function toggleMenu() {
            const navLinks = document.getElementById('navLinks');
            navLinks.classList.toggle('show');
        }
    </script>
